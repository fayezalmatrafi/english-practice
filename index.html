<title>English Practice</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  min-height:100vh;
  background:
    linear-gradient(145deg,#0f172a,#172554 55%,#312e81);
  color:white;
  padding:22px 16px;
}

.app{
  max-width:520px;
  margin:auto;
}

.header{
  text-align:center;
  margin:15px 0 25px;
}

.header h1{
  margin:0;
  font-size:30px;
  font-weight:800;
}

.header p{
  margin-top:8px;
  color:#cbd5e1;
  font-size:15px;
}

.progress-box{
  background:rgba(255,255,255,.12);
  border-radius:20px;
  padding:14px 16px;
  margin-bottom:18px;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
  font-size:14px;
}

.progress-track{
  height:8px;
  background:rgba(255,255,255,.15);
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:20%;
  background:linear-gradient(90deg,#38bdf8,#818cf8);
  border-radius:10px;
  transition:.3s;
}
