<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172554">

<title>English Practice</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#0f172a,#172554 55%,#312e81);
  color:white;
  padding:20px;
}

.app{
  max-width:600px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:5px;
  font-size:30px;
}

.header p{
  opacity:.8;
}

.progress{
  background:rgba(255,255,255,.15);
  height:9px;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0 25px;
}

#bar{
  height:100%;
  width:20%;
  background:#60a5fa;
  transition:.3s;
}

.card{
  background:white;
  color:#0f172a;
  border-radius:28px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.number{
  font-size:14px;
  color:#64748b;
}

.word{
  font-size:38px;
  font-weight:bold;
  color:#1d4ed8;
  margin:12px 0 4px;
}

.type{
  color:#64748b;
  margin-bottom:8px;
}

.meaning{
  font-size:21px;
  font-weight:bold;
  margin-bottom:24px;
}

.sentence{
  direction:ltr;
  font-size:23px;
  font-weight:bold;
  line-height:1.5;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.arabic{
  font-size:19px;
  color:#475569;
  margin:10px 0 22px;
  min-height:30px;
}

.buttons,
.extra-buttons,
.navigation{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.extra-buttons{
  margin-top:10px;
}

button{
  border:0;
  border-radius:14px;
  padding:14px 8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.listen{background:#dbeafe;color:#1e40af}
.hide{background:#ede9fe;color:#5b21b6}
.speakBtn{background:#fee2e2;color:#991b1b}
.downloadBtn{background:#fef3c7;color:#92400e}
.nav{background:#e2e8f0;color:#0f172a}

input{
  width:100%;
  padding:15px;
  margin-top:18px;
  border:2px solid #cbd5e1;
  border-radius:14px;
  font-size:17px;
  direction:ltr;
  text-align:left;
}

.check{
  width:100%;
  background:#22c55e;
  color:white;
  margin-top:10px;
}

#result{
  min-height:35px;
  padding:10px;
  font-size:18px;
  font-weight:bold;
}

#speechResult{
  display:none;
  margin-top:12px;
  padding:14px;
  background:#f8fafc;
  border-radius:12px;
  border:1px solid #e2e8f0;
}

#heardText{
  direction:ltr;
  font-weight:bold;
  font-size:18px;
  margin:8px 0;
}

#pronunciationResult{
  font-size:18px;
  font-weight:bold;
  line-height:1.6;
}

.navigation{
  margin-top:5px;
}

.counter{
  text-align:center;
  margin-top:18px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>English Practice 🇬🇧</h1>
    <p>استماع • كتابة • تحدث • مراجعة</p>
  </div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div class="card">

    <div class="number" id="number"></div>
    <div class="word" id="word"></div>
    <div class="type" id="type"></div>
    <div class="meaning" id="meaning"></div>
    <div class="sentence" id="sentence"></div>
    <div class="arabic" id="arabic"></div>

    <div class="buttons">
      <button class="listen" onclick="speak()">🔊 استمع للجملة</button>
      <button class="hide" onclick="hideSentence()">🙈 إخفاء الجملة</button>
    </div>

    <div class="extra-buttons">

      <button
        id="speakButton"
        class="speakBtn"
        onclick="startSpeaking()">
        🎙️ تحدث بالجملة
      </button>

      <button
        class="downloadBtn"
        onclick="downloadSentences()">
        📥 تحميل الجمل
      </button>

    </div>

    <div id="speechResult">
      <div>🎤 سمعت منك:</div>
      <div id="heardText"></div>
      <div id="pronunciationResult"></div>
    </div>

    <input
      id="answer"
      type="text"
      placeholder="اكتب الجملة الإنجليزية التي سمعتها"
      autocomplete="off"
    >

    <button class="check" onclick="checkAnswer()">
      ✅ تحقق من الإجابة
    </button>

    <div id="result"></div>

    <div class="navigation">
      <button class="nav" onclick="previousSentence()">السابق</button>
      <button class="nav" onclick="nextSentence()">التالي</button>
    </div>

  </div>

  <div class="counter" id="counter"></div>

</div>

<script>

const lessons = [
  {
    word:"about",
    type:"Adverb",
    meaning:"حوالي / تقريبًا",
    sentence:"It costs about 20 dollars.",
    arabic:"يكلف حوالي 20 دولار."
  },
  {
    word:"about",
    type:"Preposition",
    meaning:"عن",
    sentence:"Tell me about yourself.",
    arabic:"أخبرني عن نفسك."
  },
  {
    word:"above",
    type:"Adverb",
    meaning:"أعلاه / في الأعلى",
    sentence:"See the example given above.",
    arabic:"انظر إلى المثال المذكور أعلاه."
  },
  {
    word:"above",
    type:"Preposition",
    meaning:"فوق",
    sentence:"He lives above me.",
    arabic:"هو يعيش فوقي."
  },
  {
    word:"across",
    type:"Preposition",
    meaning:"عبر",
    sentence:"Swim across the river.",
    arabic:"اسبح عبر النهر."
  }
];

let current = 0;

function show(){

  const lesson = lessons[current];

  document.getElementById("number").innerText =
    "الجملة " + (current + 1) + " من " + lessons.length;

  document.getElementById("word").innerText = lesson.word;
  document.getElementById("type").innerText = lesson.type;
  document.getElementById("meaning").innerText = lesson.meaning;
  document.getElementById("sentence").innerText = lesson.sentence;
  document.getElementById("arabic").innerText = lesson.arabic;

  document.getElementById("sentence").style.visibility = "visible";
  document.getElementById("arabic").style.visibility = "visible";

  document.getElementById("answer").value = "";
  document.getElementById("result").innerText = "";

  document.getElementById("speechResult").style.display = "none";
  document.getElementById("heardText").innerText = "";
  document.getElementById("pronunciationResult").innerText = "";

  document.getElementById("counter").innerText =
    (current + 1) + " / " + lessons.length;

  document.getElementById("bar").style.width =
    ((current + 1) / lessons.length * 100) + "%";
}

function speak(){

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(lessons[current].sentence);

  speech.lang = "en-US";
  speech.rate = 0.82;

  speechSynthesis.speak(speech);
}

function hideSentence(){

  const sentence = document.getElementById("sentence");
  const arabic = document.getElementById("arabic");

  if(sentence.style.visibility === "hidden"){

    sentence.style.visibility = "visible";
    arabic.style.visibility = "visible";

  }else{

    sentence.style.visibility = "hidden";
    arabic.style.visibility = "hidden";
  }
}

/* تنظيف النص وتوحيد الأرقام */

function clean(text){

  let value = text.toLowerCase();

  const replacements = {
    "0":"zero",
    "1":"one",
    "2":"two",
    "3":"three",
    "4":"four",
    "5":"five",
    "6":"six",
    "7":"seven",
    "8":"eight",
    "9":"nine",
    "10":"ten",
    "11":"eleven",
    "12":"twelve",
    "13":"thirteen",
    "14":"fourteen",
    "15":"fifteen",
    "16":"sixteen",
    "17":"seventeen",
    "18":"eighteen",
    "19":"nineteen",
    "20":"twenty",
    "30":"thirty",
    "40":"forty",
    "50":"fifty",
    "60":"sixty",
    "70":"seventy",
    "80":"eighty",
    "90":"ninety",
    "100":"one hundred"
  };

  value = value.replace(/\b\d+\b/g, function(number){
    return replacements[number] || number;
  });

  return value
    .replace(/[^a-z0-9\s]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

/* حساب مدى التشابه بين جملتين */

function similarity(first, second){

  first = clean(first);
  second = clean(second);

  if(first === second){
    return 100;
  }

  const a = first.split(" ");
  const b = second.split(" ");

  const rows = a.length + 1;
  const cols = b.length + 1;

  const matrix = [];

  for(let i = 0; i < rows; i++){
    matrix[i] = [];
    matrix[i][0] = i;
  }

  for(let j = 0; j < cols; j++){
    matrix[0][j] = j;
  }

  for(let i = 1; i < rows; i++){

    for(let j = 1; j < cols; j++){

      const cost =
        a[i - 1] === b[j - 1] ? 0 : 1;

      matrix[i][j] = Math.min(
        matrix[i - 1][j] + 1,
        matrix[i][j - 1] + 1,
        matrix[i - 1][j - 1] + cost
      );
    }
  }

  const distance =
    matrix[a.length][b.length];

  const longest =
    Math.max(a.length,b.length);

  return Math.max(
    0,
    Math.round((1 - distance / longest) * 100)
  );
}

function checkAnswer(){

  const answer =
    document.getElementById("answer").value;

  const correct =
    lessons[current].sentence;

  const result =
    document.getElementById("result");

  if(clean(answer) === clean(correct)){

    result.innerHTML =
      "🎉 ممتاز! إجابتك صحيحة";

    result.style.color = "green";

  }else{

    result.innerHTML =
      "❌ حاول مرة أخرى واستمع للجملة";

    result.style.color = "red";
  }
}

/* التحقق الصوتي المرن */

let recognition = null;

function startSpeaking(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "ميزة التعرف على الصوت غير مدعومة في هذا المتصفح. جرّب Chrome أو Edge."
    );

    return;
  }

  if(recognition){

    try{
      recognition.stop();
    }catch(e){}
  }

  recognition =
    new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;

  const button =
    document.getElementById("speakButton");

  button.innerHTML =
    "🔴 أستمع إليك الآن...";

  recognition.onstart = function(){

    document.getElementById("speechResult").style.display =
      "block";

    document.getElementById("heardText").innerText =
      "تحدث الآن...";

    document.getElementById("pronunciationResult").innerText =
      "";
  };

  recognition.onresult = function(event){

    const correct =
      lessons[current].sentence;

    let bestText = "";
    let bestScore = 0;

    const results =
      event.results[0];

    for(let i = 0; i < results.length; i++){

      const text =
        results[i].transcript;

      const score =
        similarity(text,correct);

      if(score > bestScore){

        bestScore = score;
        bestText = text;
      }
    }

    document.getElementById("heardText").innerText =
      bestText;

    const pronunciation =
      document.getElementById("pronunciationResult");

    if(bestScore >= 90){

      pronunciation.innerHTML =
        "🎉 ممتاز! الجملة صحيحة<br>نسبة التطابق: " +
        bestScore +
        "%";

      pronunciation.style.color =
        "#16a34a";

    }else if(bestScore >= 75){

      pronunciation.innerHTML =
        "👏 قريب جدًا! حاول مرة أخرى<br>نسبة التطابق: " +
        bestScore +
        "%";

      pronunciation.style.color =
        "#d97706";

    }else{

      pronunciation.innerHTML =
        "🔄 حاول مرة أخرى<br>نسبة التطابق: " +
        bestScore +
        "%<br>الجملة المطلوبة:<br><b dir='ltr'>" +
        correct +
        "</b>";

      pronunciation.style.color =
        "#dc2626";
    }
  };

  recognition.onerror = function(event){

    const pronunciation =
      document.getElementById("pronunciationResult");

    if(event.error === "not-allowed"){

      pronunciation.innerHTML =
        "🎤 اسمح للموقع باستخدام الميكروفون ثم حاول مرة أخرى.";

    }else if(event.error === "no-speech"){

      pronunciation.innerHTML =
        "لم أسمع صوتًا. اضغط الزر وتحدث مرة أخرى.";

    }else{

      pronunciation.innerHTML =
        "تعذر التعرف على الصوت. حاول مرة أخرى.";
    }

    pronunciation.style.color =
      "#dc2626";
  };

  recognition.onend = function(){

    button.innerHTML =
      "🎙️ تحدث بالجملة";
  };

  try{

    recognition.start();

  }catch(error){

    button.innerHTML =
      "🎙️ تحدث بالجملة";
  }
}

/* تحميل صورة الجمل */

function downloadSentences(){

  const link =
    document.createElement("a");

  link.href =
    encodeURI("الجمل.jpeg");

  link.download =
    "English-Practice-1-5.jpeg";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);
}

function nextSentence(){

  if(current < lessons.length - 1){

    current++;

  }else{

    current = 0;

    alert("🎉 ممتاز! أنهيت الجمل الخمس");
  }

  show();
}

function previousSentence(){

  if(current > 0){

    current--;

  }else{

    current =
      lessons.length - 1;
  }

  show();
}

document
.getElementById("answer")
.addEventListener("keydown",function(event){

  if(event.key === "Enter"){
    checkAnswer();
  }

});

show();

</script>

</body>
</html>
