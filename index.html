<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172554">

<title>English Practice</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#0f172a,#172554 55%,#312e81);
  color:white;
  padding:20px;
}

.app{
  max-width:600px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:5px;
  font-size:30px;
}

.header p{opacity:.8}

.progress{
  background:rgba(255,255,255,.15);
  height:9px;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0 25px;
}

#bar{
  height:100%;
  width:20%;
  background:#60a5fa;
  transition:.3s;
}

.card{
  background:white;
  color:#0f172a;
  border-radius:28px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.number{
  font-size:14px;
  color:#64748b;
}

.word{
  font-size:38px;
  font-weight:bold;
  color:#1d4ed8;
  margin:12px 0 4px;
}

.type{
  color:#64748b;
  margin-bottom:8px;
}

.meaning{
  font-size:21px;
  font-weight:bold;
  margin-bottom:24px;
}

.sentence{
  direction:ltr;
  font-size:23px;
  font-weight:bold;
  line-height:1.5;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.arabic{
  font-size:19px;
  color:#475569;
  margin:10px 0 22px;
  min-height:30px;
}

.buttons,
.extra-buttons,
.navigation{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.extra-buttons{margin-top:10px}

button{
  border:0;
  border-radius:14px;
  padding:14px 8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.listen{background:#dbeafe;color:#1e40af}
.hide{background:#ede9fe;color:#5b21b6}
.speakBtn{background:#fee2e2;color:#991b1b}
.downloadBtn{background:#fef3c7;color:#92400e}
.nav{background:#e2e8f0;color:#0f172a}

input{
  width:100%;
  padding:15px;
  margin-top:18px;
  border:2px solid #cbd5e1;
  border-radius:14px;
  font-size:17px;
  direction:ltr;
  text-align:left;
}

.check{
  width:100%;
  background:#22c55e;
  color:white;
  margin-top:10px;
}

#result{
  min-height:35px;
  padding:10px;
  font-size:18px;
  font-weight:bold;
}

/* نتيجة التحدث */

#speechResult{
  display:none;
  margin-top:15px;
  padding:18px;
  border-radius:18px;
  border:3px solid #cbd5e1;
  transition:.3s;
}

.speech-good{
  background:#dcfce7 !important;
  border-color:#22c55e !important;
}

.speech-close{
  background:#ffedd5 !important;
  border-color:#f97316 !important;
}

.speech-bad{
  background:#fee2e2 !important;
  border-color:#ef4444 !important;
}

#statusTitle{
  font-size:23px;
  font-weight:bold;
  margin-bottom:8px;
}

#score{
  font-size:30px;
  font-weight:bold;
  margin:8px 0;
}

.heard-label{
  font-size:14px;
  color:#64748b;
  margin-top:12px;
}

#heardText{
  direction:ltr;
  font-size:18px;
  font-weight:bold;
  margin:6px 0 12px;
}

#wordDetails{
  direction:ltr;
  line-height:2;
  margin:10px 0;
}

.correct-word{
  color:#15803d;
  font-weight:bold;
}

.wrong-word{
  color:#dc2626;
  font-weight:bold;
  text-decoration:underline;
}

.retry{
  width:100%;
  margin-top:12px;
  background:#2563eb;
  color:white;
  font-size:18px;
  padding:15px;
}

.navigation{
  margin-top:5px;
}

.counter{
  text-align:center;
  margin-top:18px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>English Practice 🇬🇧</h1>
    <p>استماع • كتابة • تحدث • مراجعة</p>
  </div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div class="card">

    <div class="number" id="number"></div>
    <div class="word" id="word"></div>
    <div class="type" id="type"></div>
    <div class="meaning" id="meaning"></div>
    <div class="sentence" id="sentence"></div>
    <div class="arabic" id="arabic"></div>

    <div class="buttons">

      <button class="listen" onclick="speak()">
        🔊 استمع للجملة
      </button>

      <button class="hide" onclick="hideSentence()">
        🙈 إخفاء الجملة
      </button>

    </div>

    <div class="extra-buttons">

      <button
        id="speakButton"
        class="speakBtn"
        onclick="startSpeaking()">
        🎙️ تحدث بالجملة
      </button>

      <button
        class="downloadBtn"
        onclick="downloadSentences()">
        📥 تحميل الجمل
      </button>

    </div>

    <!-- نتيجة التحدث -->

    <div id="speechResult">

      <div id="statusTitle"></div>

      <div id="score"></div>

      <div class="heard-label">
        🎤 سمعت منك:
      </div>

      <div id="heardText"></div>

      <div id="wordDetails"></div>

      <button
        id="retryButton"
        class="retry"
        onclick="startSpeaking()">
        🎙️ حاول مرة أخرى
      </button>

    </div>

    <input
      id="answer"
      type="text"
      placeholder="اكتب الجملة الإنجليزية التي سمعتها"
      autocomplete="off"
    >

    <button
      class="check"
      onclick="checkAnswer()">
      ✅ تحقق من الإجابة
    </button>

    <div id="result"></div>

    <div class="navigation">

      <button
        class="nav"
        onclick="previousSentence()">
        السابق
      </button>

      <button
        class="nav"
        onclick="nextSentence()">
        التالي
      </button>

    </div>

  </div>

  <div
    class="counter"
    id="counter">
  </div>

</div>

<script>

const lessons = [

  {
    word:"about",
    type:"Adverb",
    meaning:"حوالي / تقريبًا",
    sentence:"It costs about 20 dollars.",
    arabic:"يكلف حوالي 20 دولار."
  },

  {
    word:"about",
    type:"Preposition",
    meaning:"عن",
    sentence:"Tell me about yourself.",
    arabic:"أخبرني عن نفسك."
  },

  {
    word:"above",
    type:"Adverb",
    meaning:"أعلاه / في الأعلى",
    sentence:"See the example given above.",
    arabic:"انظر إلى المثال المذكور أعلاه."
  },

  {
    word:"above",
    type:"Preposition",
    meaning:"فوق",
    sentence:"He lives above me.",
    arabic:"هو يعيش فوقي."
  },

  {
    word:"across",
    type:"Preposition",
    meaning:"عبر",
    sentence:"Swim across the river.",
    arabic:"اسبح عبر النهر."
  }

];

let current = 0;


/* عرض الجملة */

function show(){

  const lesson = lessons[current];

  document.getElementById("number").innerText =
    "الجملة " +
    (current + 1) +
    " من " +
    lessons.length;

  document.getElementById("word").innerText =
    lesson.word;

  document.getElementById("type").innerText =
    lesson.type;

  document.getElementById("meaning").innerText =
    lesson.meaning;

  document.getElementById("sentence").innerText =
    lesson.sentence;

  document.getElementById("arabic").innerText =
    lesson.arabic;

  document.getElementById("sentence").style.visibility =
    "visible";

  document.getElementById("arabic").style.visibility =
    "visible";

  document.getElementById("answer").value =
    "";

  document.getElementById("result").innerText =
    "";

  document.getElementById("speechResult").style.display =
    "none";

  document.getElementById("counter").innerText =
    (current + 1) +
    " / " +
    lessons.length;

  document.getElementById("bar").style.width =
    (
      (current + 1) /
      lessons.length *
      100
    ) + "%";
}


/* تشغيل صوت الجملة */

function speak(){

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      lessons[current].sentence
    );

  speech.lang =
    "en-US";

  speech.rate =
    0.82;

  speechSynthesis.speak(speech);
}


/* إخفاء الجملة */

function hideSentence(){

  const sentence =
    document.getElementById("sentence");

  const arabic =
    document.getElementById("arabic");

  if(
    sentence.style.visibility ===
    "hidden"
  ){

    sentence.style.visibility =
      "visible";

    arabic.style.visibility =
      "visible";

  }else{

    sentence.style.visibility =
      "hidden";

    arabic.style.visibility =
      "hidden";
  }
}


/* توحيد الكلمات */

function normalizeWord(word){

  word =
    word
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"")
    .trim();

  /* فروقات بسيطة */

  const equivalents = {

    "cost":"cost",
    "costs":"cost",

    "dollar":"dollar",
    "dollars":"dollar",

    "20":"twenty",
    "twenty":"twenty"

  };

  return equivalents[word] || word;
}


/* تحويل النص إلى كلمات */

function wordsFromText(text){

  let value =
    text
    .toLowerCase()
    .replace(/\$20/g," twenty dollars ")
    .replace(/\$ 20/g," twenty dollars ")
    .replace(/\b20\b/g," twenty ")
    .replace(/[.,!?]/g," ")
    .replace(/\s+/g," ")
    .trim();

  return value
    .split(" ")
    .filter(Boolean)
    .map(normalizeWord);
}


/* تشابه كلمتين */

function wordSimilarity(a,b){

  a = normalizeWord(a);
  b = normalizeWord(b);

  if(a === b){
    return 1;
  }

  if(!a || !b){
    return 0;
  }

  /* يسمح بفروق بسيطة مثل s */

  if(
    a.length >= 4 &&
    b.length >= 4
  ){

    if(
      a.startsWith(b) ||
      b.startsWith(a)
    ){
      return 0.85;
    }
  }

  return 0;
}


/* حساب التطابق الجزئي */

function calculateMatch(spoken, correct){

  const spokenWords =
    wordsFromText(spoken);

  const correctWords =
    wordsFromText(correct);

  let totalScore = 0;

  let details = [];

  let used =
    new Array(spokenWords.length)
    .fill(false);

  correctWords.forEach(
    function(correctWord){

      let bestScore = 0;
      let bestIndex = -1;

      for(
        let i = 0;
        i < spokenWords.length;
        i++
      ){

        if(used[i]){
          continue;
        }

        const score =
          wordSimilarity(
            correctWord,
            spokenWords[i]
          );

        if(score > bestScore){

          bestScore =
            score;

          bestIndex =
            i;
        }
      }

      if(
        bestIndex !== -1 &&
        bestScore >= 0.8
      ){

        used[bestIndex] =
          true;

        totalScore +=
          bestScore;

        details.push({
          word:correctWord,
          correct:true
        });

      }else{

        details.push({
          word:correctWord,
          correct:false
        });
      }

    }
  );

  let percentage =
    Math.round(
      (
        totalScore /
        correctWords.length
      ) * 100
    );

  /*
    خصم بسيط إذا قال المستخدم
    كلمات إضافية كثيرة
  */

  const extraWords =
    used.filter(
      item => !item
    ).length;

  if(extraWords > 0){

    percentage -=
      extraWords * 5;
  }

  percentage =
    Math.max(
      0,
      Math.min(
        100,
        percentage
      )
    );

  return {
    percentage,
    details
  };
}


/* الكتابة */

function clean(text){

  return text
    .toLowerCase()
    .replace(/[.,!?]/g,"")
    .replace(/\s+/g," ")
    .trim();
}


function checkAnswer(){

  const answer =
    document.getElementById("answer").value;

  const correct =
    lessons[current].sentence;

  const result =
    document.getElementById("result");

  if(
    clean(answer) ===
    clean(correct)
  ){

    result.innerHTML =
      "🎉 ممتاز! إجابتك صحيحة";

    result.style.color =
      "green";

  }else{

    result.innerHTML =
      "❌ حاول مرة أخرى واستمع للجملة";

    result.style.color =
      "red";
  }
}


/* التحدث */

let recognition = null;


function startSpeaking(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "ميزة التعرف على الصوت غير مدعومة في هذا المتصفح."
    );

    return;
  }


  if(recognition){

    try{

      recognition.abort();

    }catch(e){}

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    5;


  const button =
    document.getElementById(
      "speakButton"
    );


  const speechBox =
    document.getElementById(
      "speechResult"
    );


  button.innerHTML =
    "🔴 أستمع إليك الآن...";


  speechBox.style.display =
    "block";

  speechBox.className =
    "";

  document.getElementById(
    "statusTitle"
  ).innerHTML =
    "🎙
