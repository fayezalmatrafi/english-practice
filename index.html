<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172554">

<title>English Practice</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#0f172a,#172554 55%,#312e81);
  color:white;
  padding:20px;
}

.app{
  max-width:600px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:5px;
  font-size:30px;
}

.header p{
  opacity:.8;
}

.progress{
  background:rgba(255,255,255,.15);
  height:9px;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0 25px;
}

#bar{
  height:100%;
  width:20%;
  background:#60a5fa;
  transition:.3s;
}

.card{
  background:white;
  color:#0f172a;
  border-radius:28px;
  padding:28px 20px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.number{
  font-size:14px;
  color:#64748b;
}

.word{
  font-size:38px;
  font-weight:bold;
  color:#1d4ed8;
  margin:12px 0 4px;
}

.type{
  color:#64748b;
  margin-bottom:8px;
}

.meaning{
  font-size:21px;
  font-weight:bold;
  margin-bottom:24px;
}

.sentence{
  direction:ltr;
  font-size:23px;
  font-weight:bold;
  line-height:1.5;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.arabic{
  font-size:19px;
  color:#475569;
  margin:10px 0 22px;
  min-height:30px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  border:0;
  border-radius:14px;
  padding:14px 8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.listen{
  background:#dbeafe;
  color:#1e40af;
}

.hide{
  background:#ede9fe;
  color:#5b21b6;
}

.speakBtn{
  background:#fee2e2;
  color:#991b1b;
}

.downloadBtn{
  background:#fef3c7;
  color:#92400e;
}

.extra-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

input{
  width:100%;
  padding:15px;
  margin-top:18px;
  border:2px solid #cbd5e1;
  border-radius:14px;
  font-size:17px;
  direction:ltr;
  text-align:left;
}

.check{
  width:100%;
  background:#22c55e;
  color:white;
  margin-top:10px;
}

#result{
  min-height:35px;
  padding:10px;
  font-size:18px;
  font-weight:bold;
}

#speechResult{
  display:none;
  margin-top:12px;
  padding:13px;
  background:#f8fafc;
  border-radius:12px;
  border:1px solid #e2e8f0;
  font-size:16px;
}

#heardText{
  direction:ltr;
  font-weight:bold;
  margin-top:7px;
}

.navigation{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:5px;
}

.nav{
  background:#e2e8f0;
  color:#0f172a;
}

.counter{
  text-align:center;
  margin-top:18px;
  opacity:.8;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>English Practice 🇬🇧</h1>
    <p>استماع • كتابة • تحدث • مراجعة</p>
  </div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div class="card">

    <div class="number" id="number"></div>

    <div class="word" id="word"></div>

    <div class="type" id="type"></div>

    <div class="meaning" id="meaning"></div>

    <div class="sentence" id="sentence"></div>

    <div class="arabic" id="arabic"></div>

    <div class="buttons">
      <button class="listen" onclick="speak()">
        🔊 استمع للجملة
      </button>

      <button class="hide" onclick="hideSentence()">
        🙈 إخفاء الجملة
      </button>
    </div>

    <div class="extra-buttons">

      <button
        id="speakButton"
        class="speakBtn"
        onclick="startSpeaking()">
        🎙️ تحدث بالجملة
      </button>

      <button
        class="downloadBtn"
        onclick="downloadSentences()">
        📥 تحميل الجمل
      </button>

    </div>

    <div id="speechResult">
      <div>🎤 سمعت منك:</div>
      <div id="heardText"></div>
      <div id="pronunciationResult"></div>
    </div>

    <input
      id="answer"
      type="text"
      placeholder="اكتب الجملة الإنجليزية التي سمعتها"
      autocomplete="off"
    >

    <button class="check" onclick="checkAnswer()">
      ✅ تحقق من الإجابة
    </button>

    <div id="result"></div>

    <div class="navigation">
      <button class="nav" onclick="previousSentence()">السابق</button>
      <button class="nav" onclick="nextSentence()">التالي</button>
    </div>

  </div>

  <div class="counter" id="counter"></div>

</div>

<script>

const lessons = [
  {
    word:"about",
    type:"Adverb",
    meaning:"حوالي / تقريبًا",
    sentence:"It costs about 20 dollars.",
    arabic:"يكلف حوالي 20 دولار."
  },
  {
    word:"about",
    type:"Preposition",
    meaning:"عن",
    sentence:"Tell me about yourself.",
    arabic:"أخبرني عن نفسك."
  },
  {
    word:"above",
    type:"Adverb",
    meaning:"أعلاه / في الأعلى",
    sentence:"See the example given above.",
    arabic:"انظر إلى المثال المذكور أعلاه."
  },
  {
    word:"above",
    type:"Preposition",
    meaning:"فوق",
    sentence:"He lives above me.",
    arabic:"هو يعيش فوقي."
  },
  {
    word:"across",
    type:"Preposition",
    meaning:"عبر",
    sentence:"Swim across the river.",
    arabic:"اسبح عبر النهر."
  }
];

let current = 0;

function show(){

  const lesson = lessons[current];

  document.getElementById("number").innerText =
    "الجملة " + (current + 1) + " من " + lessons.length;

  document.getElementById("word").innerText = lesson.word;
  document.getElementById("type").innerText = lesson.type;
  document.getElementById("meaning").innerText = lesson.meaning;
  document.getElementById("sentence").innerText = lesson.sentence;
  document.getElementById("arabic").innerText = lesson.arabic;

  document.getElementById("sentence").style.visibility = "visible";
  document.getElementById("arabic").style.visibility = "visible";

  document.getElementById("answer").value = "";
  document.getElementById("result").innerText = "";

  document.getElementById("speechResult").style.display = "none";
  document.getElementById("heardText").innerText = "";
  document.getElementById("pronunciationResult").innerText = "";

  document.getElementById("counter").innerText =
    (current + 1) + " / " + lessons.length;

  document.getElementById("bar").style.width =
    ((current + 1) / lessons.length * 100) + "%";
}

function speak(){

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(lessons[current].sentence);

  speech.lang = "en-US";
  speech.rate = 0.82;

  speechSynthesis.speak(speech);
}

function hideSentence(){

  const sentence = document.getElementById("sentence");
  const arabic = document.getElementById("arabic");

  if(sentence.style.visibility === "hidden"){

    sentence.style.visibility = "visible";
    arabic.style.visibility = "visible";

  }else{

    sentence.style.visibility = "hidden";
    arabic.style.visibility = "hidden";
  }
}

function clean(text){

  return text
    .toLowerCase()
    .replace(/[.,!?]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function checkAnswer(){

  const answer =
    document.getElementById("answer").value;

  const correct =
    lessons[current].sentence;

  const result =
    document.getElementById("result");

  if(clean(answer) === clean(correct)){

    result.innerHTML =
      "🎉 ممتاز! إجابتك صحيحة";

    result.style.color = "green";

  }else{

    result.innerHTML =
      "❌ حاول مرة أخرى واستمع للجملة";

    result.style.color = "red";
  }
}

/* =========================
   التحدث بالجملة
========================= */

let recognition = null;

function startSpeaking(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "ميزة التعرف على الصوت غير مدعومة في هذا المتصفح. جرّب Chrome أو Edge."
    );

    return;
  }

  if(recognition){
    try{
      recognition.stop();
    }catch(e){}
  }

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  const button =
    document.getElementById("speakButton");

  button.innerHTML = "🔴 أستمع إليك الآن...";

  recognition.onstart = function(){

    document.getElementById("speechResult").style.display =
      "block";

    document.getElementById("heardText").innerText =
      "تحدث الآن...";
  };

  recognition.onresult = function(event){

    const spoken =
      event.results[0][0].transcript;

    const correct =
      lessons[current].sentence;

    const heard =
      document.getElementById("heardText");

    const pronunciation =
      document.getElementById("pronunciationResult");

    heard.innerText = spoken;

    if(clean(spoken) === clean(correct)){

      pronunciation.innerHTML =
        "🎉 ممتاز! نطقت الجملة بشكل صحيح";

      pronunciation.style.color =
        "green";

    }else{

      pronunciation.innerHTML =
        "🔄 حاول مرة أخرى<br>الجملة المطلوبة:<br><b dir='ltr'>" +
        correct +
        "</b>";

      pronunciation.style.color =
        "#dc2626";
    }
  };

  recognition.onerror = function(event){

    const pronunciation =
      document.getElementById("pronunciationResult");

    if(event.error === "not-allowed"){

      pronunciation.innerHTML =
        "🎤 اسمح للموقع باستخدام الميكروفون ثم حاول مرة أخرى.";

    }else if(event.error === "no-speech"){

      pronunciation.innerHTML =
        "لم أسمع صوتًا. اضغط الزر وتحدث مرة أخرى.";

    }else{

      pronunciation.innerHTML =
        "تعذر التعرف على الصوت. حاول مرة أخرى.";
    }

    pronunciation.style.color =
      "#dc2626";
  };

  recognition.onend = function(){

    button.innerHTML =
      "🎙️ تحدث بالجملة";
  };

  try{

    recognition.start();

  }catch(error){

    button.innerHTML =
      "🎙️ تحدث بالجملة";
  }
}

/* =========================
   تحميل صورة الجمل
========================= */

function downloadSentences(){

  const link =
    document.createElement("a");

  link.href =
    encodeURI("الجمل.jpeg");

  link.download =
    "English-Practice-1-5.jpeg";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);
}

function nextSentence(){

  if(current < lessons.length - 1){

    current++;

  }else{

    current = 0;

    alert("🎉 ممتاز! أنهيت الجمل الخمس");
  }

  show();
}

function previousSentence(){

  if(current > 0){
    current--;
  }else{
    current = lessons.length - 1;
  }

  show();
}

document
.getElementById("answer")
.addEventListener("keydown",function(event){

  if(event.key === "Enter"){
    checkAnswer();
  }

});

show();

</script>

</body>
</html>
